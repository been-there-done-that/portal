[package]
name = "portal"
version = "0.1.0"
edition = "2021"
description = "Local dev proxy — named .localhost URLs instead of port numbers"
license = "Apache-2.0"
repository = "https://github.com/been-there-done-that/portal"

[lib]
name = "portal"
path = "src/lib.rs"

[[bin]]
name = "portal"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "client", "client-legacy", "server", "server-auto"] }
http-body-util = "0.1"
rustls = { version = "0.23", features = ["std", "ring"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"
bytes = "1"
http = "1"
axum = { version = "0.8", features = ["http1", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8"
tokio-stream = { version = "0.1", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "signal", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"
axum = "0.8"
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
